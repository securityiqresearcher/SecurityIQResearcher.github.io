<!DOCTYPE html>
<html>
<head>
    <title>Contact - Security IQ Researcher</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .terminal {
            max-width: 600px;
            margin: 50px auto;
            border: 1px solid #00ff41;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
        }

        .command-line {
            margin: 20px 0;
        }

        .prompt {
            color: #00ff41;
        }

        .contact-email {
            color: #00ff41;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
        }

        .contact-email:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .note {
            color: #888;
            font-size: 0.9em;
            margin-top: 30px;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            margin-top: 40px;
            display: inline-block;
        }

        .back-link:hover {
            color: #00ff41;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="command-line">
            <span class="prompt">$</span> whoami
        </div>
        <div>securityiqresearcher</div>

        <div class="command-line">
            <span class="prompt">$</span> contact --method
        </div>
        <div>
            Email: <a href="mailto:Security@SecurityIQResearcher.com" class="contact-email">Security@SecurityIQResearcher.com</a>
        </div>

        <div class="command-line">
            <span class="prompt">$</span> echo "For research collab, vuln reports, or just to say hi"
        </div>

        <div class="note">
            // Response time: When I'm not hacking things<br>
            // PGP available if you're paranoid<br>
            // Don't spam, I have better things to do
        </div>

        <a href="index.html" class="back-link">[cd ..]</a>
    </div>
</body>
</html>
