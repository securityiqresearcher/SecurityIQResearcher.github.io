<!DOCTYPE html>
<html>
<head>
    <title>Security IQ Researcher</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        
        .main-text {
            font-size: 3em;
            text-align: center;
            z-index: 2;
            position: relative;
        }
        
        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            z-index: 1;
        }
        
        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }
        
        .vulnerability {
            position: absolute;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5); /* 50% opacity */
            font-weight: 100;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            white-space: nowrap;
            transform-origin: center;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .privacy-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.3em;
            color: #666;
            z-index: 3;
        }
        
        a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="main-text">
        Hello World :), SecurityIQResearcher!
    </div>
    
    <div class="orbit-container">
        <div class="orbit">
            <!-- Vulnerabilities will be positioned here by JavaScript -->
        </div>
    </div>
    
    <div class="privacy-link">
        <a href="privacy-legal.html">Privacy & Legal</a>
    </div>

    <script>
        const vulnerabilities = [
            "Assetlinks Exposure",
            "GH Actions Secrets", 
            "Permissive CORS Misconfiguration",
            "CAPTCHA Bypass",
            "GraphQL Info Leak",
            "Session Fixation", 
            "WP User Enum",
            "CFEngine Auth Bypass",
            "DOM XSS innerHTML"
        ];
        
        const orbit = document.querySelector('.orbit');
        const radius = 250; // Orbit radius
        const angleStep = (2 * Math.PI) / vulnerabilities.length;
        
        vulnerabilities.forEach((vuln, index) => {
            const angle = index * angleStep;
            const x = radius * Math.cos(angle);
            const y = radius * Math.sin(angle);
            
            const vulnElement = document.createElement('div');
            vulnElement.className = 'vulnerability';
            vulnElement.textContent = vuln;
            vulnElement.style.left = `calc(50% + ${x}px)`;
            vulnElement.style.top = `calc(50% + ${y}px)`;
            vulnElement.style.transform = `translate(-50%, -50%) rotate(${-angle}rad)`;
            
            orbit.appendChild(vulnElement);
        });
    </script>
</body>
</html>
