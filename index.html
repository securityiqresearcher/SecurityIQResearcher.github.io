<!DOCTYPE html>
<html>
<head>
    <title>Security IQ Researcher</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        .main-text {
            font-size: 3em;
            text-align: center;
            z-index: 2;
            position: relative;
        }
        
        .orbit-ring {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rotate 30s linear infinite;
        }
        
        .vulnerability {
            position: absolute;
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 100;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            white-space: nowrap;
            top: 0;
            left: 50%;
            transform-origin: 50% 300px;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .privacy-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.3em;
            color: #666;
            z-index: 3;
        }
        
        a {
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="main-text">
        Hello World :), SecurityIQResearcher!
    </div>
    
    <div class="orbit-ring" id="orbitRing">
        <!-- Vulnerabilities will be positioned here -->
    </div>
    
    <div class="privacy-link">
        <a href="privacy-legal.html">Privacy & Legal</a>
    </div>

    <script>
        const vulnerabilities = [
            "Assetlinks Exposure",
            "GH Actions Secrets", 
            "Permissive CORS Misconfiguration",
            "CAPTCHA Bypass", 
            "GraphQL Info Leak",
            "Session Fixation",
            "WP User Enum",
            "CFEngine Auth Bypass",
            "DOM XSS innerHTML"
        ];
        
        const orbit = document.getElementById('orbitRing');
        
        vulnerabilities.forEach((vuln, index) => {
            const angle = (index / vulnerabilities.length) * 360;
            
            const vulnElement = document.createElement('div');
            vulnElement.className = 'vulnerability';
            vulnElement.textContent = vuln;
            vulnElement.style.transform = `rotate(${angle}deg)`;
            
            orbit.appendChild(vulnElement);
        });
    </script>
</body>
</html>
