<!DOCTYPE html>
<html>
<head>
    <title>Security IQ Researcher</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            perspective: 1000px;
            overflow: hidden;
        }
        
        .main-text {
            font-size: 3em;
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        .earth-sphere {
            position: absolute;
            width: 500px;
            height: 500px;
            transform-style: preserve-3d;
            animation: rotate3d 40s infinite linear;
        }
        
        .vulnerability {
            position: absolute;
            font-size: 0.6em;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 100;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            white-space: nowrap;
            transform-origin: center;
            backface-visibility: hidden;
        }
        
        @keyframes rotate3d {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }
        
        .privacy-link {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 0.8em; /* BIGGER */
            color: #aaa; /* LIGHTER COLOR */
            z-index: 11;
            padding: 8px 16px;
            border: 1px solid #444;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        a {
            color: #aaa;
            text-decoration: none;
            font-weight: normal;
        }
        
        a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="main-text">
        Hello World :), SecurityIQResearcher!
    </div>
    
    <div class="earth-sphere" id="earthSphere">
        <!-- 3D vulnerabilities will be positioned here -->
    </div>
    
    <div class="privacy-link">
        <a href="privacy-legal.html">Privacy & Legal</a>
    </div>

    <script>
        const vulnerabilities = [
            "Assetlinks Exposure",
            "GH Actions Secrets", 
            "Permissive CORS Misconfiguration",
            "CAPTCHA Bypass",
            "GraphQL Info Leak",
            "Session Fixation",
            "WP User Enum",
            "CFEngine Auth Bypass",
            "DOM XSS innerHTML"
        ];
        
        const sphere = document.getElementById('earthSphere');
        const radius = 200;
        
        // Distribute vulnerabilities in 3D sphere coordinates
        vulnerabilities.forEach((vuln, index) => {
            // Spherical coordinates
            const phi = Math.acos(-1 + (2 * index) / vulnerabilities.length);
            const theta = Math.sqrt(vulnerabilities.length * Math.PI) * phi;
            
            // Convert to Cartesian coordinates
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);
            
            const vulnElement = document.createElement('div');
            vulnElement.className = 'vulnerability';
            vulnElement.textContent = vuln;
            vulnElement.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
            
            sphere.appendChild(vulnElement);
        });
    </script>
</body>
</html>
